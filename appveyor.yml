version: 1.0.{build}
image: Ubuntu2404
clone_depth: 1

environment:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never

cache:
  - /home/appveyor/.cargo/registry -> Cargo.lock, rust-toolchain.toml
  - /home/appveyor/.cargo/git -> Cargo.lock

install:
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
  - sudo apt-get update -qq
  - sudo apt-get install -y -qq libasound2-dev libudev-dev pkg-config

build_script:
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-items --lib legacy_1_8_9 -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-items --lib custom_name -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client-core --lib potions_1_8_9 -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client-render --lib brewing -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client --lib save::tests::a_1_8_entity_gets_the_legacy_id_uuid_and_health -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client --bins game::creatures::tests -j 2'

test: off
