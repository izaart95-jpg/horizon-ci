version: 1.0.{build}
image: Ubuntu2404
clone_depth: 1

environment:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never

cache:
  - /home/appveyor/.cargo/registry -> Cargo.lock, rust-toolchain.toml
  - /home/appveyor/.cargo/git -> Cargo.lock

install:
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
  - sudo apt-get update -qq
  - sudo apt-get install -y -qq libasound2-dev libudev-dev pkg-config

build_script:
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-items --lib legacy_1_8_9 -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-items --lib enchant_1_8_9 -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-world --lib biome_layer_1_8_9 -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client --lib stations::tests -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-items --lib custom_name -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client-core --lib potions_1_8_9 -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client-core --lib component::tests::saved_names_parse_the_json_a_legacy_fixer_wrote -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client-core --lib lang::tests -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client-render --lib brewing -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client-render --lib command_block::tests::a_loaded_command_block_name_reads_the_fixers_json -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client --lib save::tests::a_1_8_entity_gets_the_legacy_id_uuid_and_health -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client --lib entity_nbt::tests::a_datafixed_json_armor_stand_name_shows_its_words -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client --lib mobs::spawn_1_8_9::tests -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client --bins game::creatures::tests -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client --bins game::natural_spawning::tests -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client --bins game::achievements::tests -j 2'
  - 'source "$HOME/.cargo/env" && cargo test -p horizon-client --bins game::remote_1_8_9::tests -j 2'

test: off
